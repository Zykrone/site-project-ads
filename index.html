<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Gestion ADS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: radial-gradient(circle at 50% -20%, #1a2a3a 0%, #050608 60%);
        min-height: 100vh;
        font-family: 'Outfit', sans-serif;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        color: #00d2ff;
        font-family: monospace;
        font-size: 1rem;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #loading-screen .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 210, 255, 0.1);
        border-top-color: #00d2ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <span>CONNEXION AU RÉSEAU...</span>
      <a href="javascript:location.reload(true)" style="color:rgba(0, 210, 255, 0.3);text-decoration:none;font-size:0.7rem;margin-top:20px;font-family:sans-serif;">RELANCER SI BLOQUÉ</a>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="color:#fff;text-align:center;padding:50px;font-family:sans-serif;">
        JavaScript est requis pour accéder à ce site.
      </div>
    </noscript>
    <script type="module" src="./src/main.jsx" onerror="alert('Erreur: Le script principal n\'a pas pu être chargé. Vérifiez votre connexion.')"></script>
    <script>
      // Cette fonction sera appelée par React quand il sera prêt
      window.hideLoadingScreen = function() {
        var el = document.getElementById('loading-screen');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function() {
            el.style.display = 'none';
          }, 500);
        }
      };
      
      // Sécurité : si React ne se lance pas après 15s, on montre quand même quelque chose
      setTimeout(function() {
        var el = document.getElementById('loading-screen');
        if (el && el.style.display !== 'none') {
          // On ne fait rien, on laisse l'utilisateur voir que ça charge encore
          // ou on pourrait mettre un message d'erreur ici.
        }
      }, 15000);
    </script>
  </body>
</html>
